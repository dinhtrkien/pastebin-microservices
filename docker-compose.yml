version: "3.8"
services:
  database:
    image: postgres:15
    container_name: pastebin_postgres
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: pastebin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data # Persist data
    restart: unless-stopped # Added restart policy

  # pgbouncer:
  #   image: edoburu/pgbouncer
  #   container_name: pastebin_pgbouncer
  #   depends_on:
  #     - database
  #   ports:
  #     - "6432:6432" # Expose PgBouncer port
  #   volumes:
  #     - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
  #     - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
  #   environment:
  #     DATABASES_HOST: database
  #     PGDATABASE: pastebin # Optional: Default database if not specified in connection string
  #   restart: unless-stopped

  redis: # Add Redis service
    image: redis:alpine # Use a lightweight image
    container_name: pastebin_redis
    ports:
      - "6379:6379" # Expose Redis port
    volumes:
      - redis_data:/data # Persist Redis data (optional but good practice)
    restart: unless-stopped

  slug-generator-service:
    build:
      context: ./slug-generator-service
      dockerfile: Dockerfile
    container_name: pastebin_slug_generator
    depends_on:
      # - pgbouncer # Depends on pgbouncer for DB connections
      - redis     # Depends on redis for caching/checking slugs
    ports:
      - "3001:3001" # Map host port 3001 to container port 3001
    environment:
      # Point to pgbouncer service for database connection
      DATABASE_URL: postgresql://root:rootpassword@database:5432/pastebin?schema=public
      # DATABASE_URL: postgresql://root:rootpassword@pgbouncer:6432/pastebin?pgbouncer=true
      # Point to redis service
      REDIS_URL: redis://redis:6379
      PORT: 3001 # Ensure the service runs on the exposed port
      # REDIS_TTL: 3600 # Keep default or override if needed
    restart: unless-stopped

  paste-service:
    build:
      context: ./paste-service
      dockerfile: Dockerfile
    container_name: pastebin_paste_service
    depends_on:
      # - pgbouncer             # Depends on pgbouncer for DB connections
      - redis                 # Depends on redis for caching
      - slug-generator-service # Depends on slug generator
      - analytic-service      # Depends on analytic service
    ports:
      - "3000:3000" # Map host port 3000 to container port 3000
    environment:
      # Point to pgbouncer service for database connection
      DATABASE_URL: postgresql://root:rootpassword@database:5432/pastebin?schema=public
      # DATABASE_URL: postgresql://root:rootpassword@pgbouncer:6432/pastebin?pgbouncer=true
      # Point to redis service
      REDIS_URL: redis://redis:6379
      # Point to slug-generator service
      SLUG_GENERATOR_URL: http://slug-generator-service:3001
      # Point to analytic service
      ANALYTIC_SERVICE_URL: http://analytic-service:3002
      PORT: 3000 # Ensure the service runs on the exposed port
      # REDIS_TTL: 3600 # Keep default or override if needed
      ENABLE_REDIS_CACHE: "true" # Feature flag for Redis caching
    restart: unless-stopped

  analytic-service: # Add the Analytic service
    build:
      context: ./analytic # Path to the service's code and Dockerfile
      dockerfile: Dockerfile
    container_name: pastebin_analytic_service
    depends_on:
      - database # Depends on the database service (direct connection, not pgbouncer)
    ports:
      - "3002:3002" # Map host port 3002 to container port 3002
    restart: unless-stopped

  analytic-worker:
    build:
      context: ./analyticWorker # Path to the service's code and Dockerfile
      dockerfile: Dockerfile
    container_name: pastebin_analytic_worker
    depends_on:
      - database # Depends on the database service (direct connection, not pgbouncer)
    ports:
      - "3006:3006" # Map host port 3002 to container port 3002
    restart: unless-stopped

  token-range-service:
    build: ./token-range-service
    container_name: pastebin-token-range-service
    env_file:
      - ./token-range-service/.env
    ports:
      - "3003:3003"
    depends_on:
      - database

  token-service:
    build: ./token-service
    container_name: pastebin-token-service
    env_file:
      - ./token-service/.env
    ports:
      - "3004:3004"
    depends_on:
      - redis
      # - token-range-service

volumes:
  postgres_data: # Define the volume for PostgreSQL data persistence
  redis_data: # Define the volume for Redis data persistence